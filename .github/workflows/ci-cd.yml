name: CI/CD

# Triggers en push y PR hacia las ramas de Testing (homologacion)
# y Producción (produccion). Nota: el repo usa 'produccion' en
# lugar de 'main'.
on:
  push:
    branches: [homologacion, produccion]
  pull_request:
    branches: [homologacion, produccion]

jobs:
  # ─────────────────────────────────────────────────────────────
  # Backend (.NET 8): restore → build (Release) → test
  # ─────────────────────────────────────────────────────────────
  backend-ci:
    name: Backend CI (.NET 8)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('backend/**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore Backend.sln

      - name: Build (Release)
        run: dotnet build Backend.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test Backend.sln --no-build --verbosity normal

  # ─────────────────────────────────────────────────────────────
  # Frontend (React 19 + Vite): install → lint → build (tsc + vite)
  # ─────────────────────────────────────────────────────────────
  frontend-ci:
    name: Frontend CI (React + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (no bloqueante)
        run: npm run lint
        continue-on-error: true

      - name: Build de producción (tsc + vite)
        run: npm run build