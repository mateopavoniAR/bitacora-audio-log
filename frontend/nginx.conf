# Configuración de Nginx para servir la aplicación SPA React + Vite
server {
    listen 80;
    server_name localhost;

    # Directorio raíz donde Nginx buscará los archivos construidos
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # Redirección interna hacia index.html para soportar navegación SPA / rutas
        try_files $uri $uri/ /index.html;
    }

    # Caché estática para assets generados con hash de Vite
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc)$ {
        root /usr/share/nginx/html;
        expires 1M;
        access_log off;
        add_header Cache-Control "public";
    }

    # Página de error por defecto
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
